<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f2744"><title>Quote & Invoice Manager</title>
<style>
:root{--navy:#0f2744;--blue:#2563eb;--bg:#f1f5f9;--mut:#64748b;--line:#e2e8f0;--ok:#059669}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:#93c5fd;font-size:12px}
main{max-width:860px;margin:auto;padding:14px 12px 100px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:9;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:var(--mut);font-size:10px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}nav b{font-size:19px;font-weight:500}nav .on{color:var(--blue);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0f274410}
h2{font-size:19px;margin:2px 0 12px}h3{font-size:15px;margin:4px 0 10px}.mut,.muted{color:var(--mut);font-size:12px}.row{display:flex;gap:9px;align-items:flex-end}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;font-weight:650;color:#475569;margin:10px 0 5px}
input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 10px;font:inherit;background:#fff;color:#172033}textarea{min-height:70px}
.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:11px 14px;font-weight:650;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#e8effd;color:#1d4ed8}.btn.dark{background:var(--navy)}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ok{background:var(--ok)}.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;margin:9px 0;cursor:pointer}.item .meta{color:var(--mut);font-size:12px;margin:3px 0}.empty{text-align:center;color:var(--mut);padding:24px 8px}
.ms{border:1px dashed #cbd5e1;padding:10px;border-radius:12px;margin:9px 0}.mh{display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef4ff;border-radius:13px;padding:12px}.stat strong{font-size:19px;display:block}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.tot.gr{font-weight:800;font-size:17px;border:0}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#e2e8f0;color:#334155;white-space:nowrap}.c-Sent,.c-Issued{background:#dbeafe;color:#1d4ed8}.c-Accepted,.c-Paid{background:#d1fae5;color:#047857}.c-Rejected,.c-Overdue,.c-Cancelled{background:#fee2e2;color:#b91c1c}.c-Expired,.c-Partiallypaid{background:#fef3c7;color:#b45309}
table.rp{width:100%;border-collapse:collapse;font-size:12px}.rp td,.rp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.rp td:first-child,.rp th:first-child{text-align:left}.bar{display:block;height:5px;background:var(--blue);border-radius:3px;margin-top:3px}
#lock{position:fixed;inset:0;background:var(--navy);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px}.lk{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:340px;text-align:center}.lk input{margin:14px 0 10px;text-align:center}.lk .btn{width:100%}#le{color:#b91c1c;font-size:13px;min-height:18px;margin-top:8px}
nav{grid-template-columns:repeat(6,1fr)!important}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 2px;font:inherit;font-size:13px;color:var(--mut)}.seg .on{background:var(--navy);color:#fff;border-color:var(--navy)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0f2744;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;display:none;font-size:13px;max-width:90%;text-align:center}
@page{size:A4;margin:14mm 12mm 16mm;@bottom-center{content:"Page " counter(page) " of " counter(pages);font-size:9px}}
@media print{header,nav,.np,#toast{display:none!important}body,main{background:#fff;padding:0;max-width:none}#pa{zoom:1!important;box-shadow:none!important}.card{box-shadow:none}.doc{width:auto!important;padding:0!important}}
</style></head><body>
<header><h1 id="hb">Quote & Invoice Manager</h1><p>Quotations · GST invoices · Payments</p></header><div id="lock"><div class="lk"><div style="font-size:42px">🔒</div><h2 style="margin:6px 0">Quote & Invoice Manager</h2><div class="mut">Enter password to open</div><input id="lp" type="password" autocomplete="off" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()"><button class="btn" onclick="unlock()">Unlock</button><div id="le"></div></div></div><div id="toast"></div><main id="v"></main><nav id="nav"></nav>
<script>
const KEY='quoteInvoiceManagerV1',$=id=>document.getElementById(id);
let db={customers:[],materials:[],docs:[],settings:{},bills:[],expenses:[],netMaterials:[],netPayments:[],expCats:[]},tab='home',F={},RP={fy:'',from:'',to:''},RD=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100,money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const GST=/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/,ST_Q=['Draft','Sent','Accepted','Rejected','Expired'],ST_I=['Draft','Issued','Partially paid','Paid','Overdue','Cancelled'];
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
const paid=d=>r2((d.payments||[]).reduce((a,p)=>a+p.amount,0)),bal=d=>r2(d.grand-paid(d));
function eff(d){let st=d.status||(d.type==='invoice'?'Issued':'Draft');if(d.type==='quotation')return st==='Sent'&&d.validUntil&&d.validUntil<today()?'Expired':st;if(st==='Draft'||st==='Cancelled')return st;if(bal(d)<=0)return'Paid';let od=d.due&&d.due<today();return od?'Overdue':paid(d)>0?'Partially paid':'Issued'}
const chip=s=>`<span class="chip c-${s.replace(/\W/g,'')}">${s}</span>`;
const fy=dt=>{let y=+dt.slice(0,4),s=+dt.slice(5,7)>=4?y:y-1;return s+'-'+String(s+1).slice(2)};
function nextNo(t,dt){let p=db.settings[t==='invoice'?'iPre':'qPre']||(t==='invoice'?'INV':'QT'),h=p+'/'+fy(dt)+'/',m=0;db.docs.forEach(d=>{if(d.type===t&&String(d.number).startsWith(h))m=Math.max(m,parseInt(d.number.slice(h.length))||0)});return h+String(m+1).padStart(3,'0')}
function lg(d,t){(d.log=d.log||[]).push({at:new Date().toISOString(),t})}
function load(){let raw=localStorage.getItem(KEY);try{if(raw){if(!localStorage.getItem(KEY+'_pre_v2'))localStorage.setItem(KEY+'_pre_v2',raw);let p=JSON.parse(raw);db={customers:[],materials:[],docs:[],settings:{},...p}}}catch(e){toast('Saved data could not be read')}migrate();RP.fy=fy(today());go('home')}
function migrate(){db.settings=db.settings||{};['bills','expenses','netMaterials','netPayments','expCats'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.bills.forEach(b=>{b.receipts=b.receipts||[]});db.docs.forEach(d=>{d.status=d.status||(d.type==='invoice'?'Issued':'Draft');d.payments=d.payments||[];d.log=d.log||[]});hdr()}
function hdr(){$('hb').textContent=db.settings.business||'Quote & Invoice Manager'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage full – download a backup and remove large images')}hdr()}
const NAV=[['home','⌂','Home'],['quotation','▤','Quotes'],['invoice','▣','Invoices'],['billing','₹','Billing'],['customers','♙','Customers'],['more','☰','More']];
function go(t,a){tab=t;window[t==='show'?'showDoc':t==='more'?'more':t](a);scrollTo(0,0);let on=['bForm','bView','eForm','nmForm','npForm'].includes(t)?'billing':['catalogue','reports','settings','matForm'].includes(t)?'more':['custForm','hist'].includes(t)?'customers':t==='show'||t==='editor'||t==='pv'?(db.docs.find(d=>d.id===a)?.type||a):t;$('nav').innerHTML=NAV.map(n=>`<button class="${n[0]===on?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}
function docRow(d){let i=d.type==='invoice',b=i&&d.status!=='Draft'&&d.status!=='Cancelled'&&bal(d)>0;return`<div class="item" onclick="go('show','${d.id}')"><div class="tl"><strong>${esc(d.number)}</strong>${chip(eff(d))}</div><div class="meta">${esc(d.customerName)} · ${esc(d.date)}</div><b>${money(d.grand)}</b>${b?` <span class="mut">· Balance ${money(bal(d))}</span>`:''}</div>`}
function home(){let Q=db.docs.filter(d=>d.type==='quotation'),I=db.docs.filter(d=>d.type==='invoice'),A=I.filter(d=>!['Draft','Cancelled'].includes(d.status)),sum=a=>r2(a.reduce((s,d)=>s+d.grand,0)),pend=r2(A.reduce((s,d)=>s+Math.max(0,bal(d)),0)),od=A.filter(d=>eff(d)==='Overdue').length,
lgs=db.docs.flatMap(d=>d.log.map(l=>({...l,n:d.number}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5),rec=db.docs.slice().sort((a,b)=>(b.updated||b.date||'').localeCompare(a.updated||a.date||'')).slice(0,5);
$('v').innerHTML=`<div class="card"><h2>Dashboard</h2><div class="g2"><div class="stat"><strong>${Q.length}</strong><span class="mut">Quotations</span></div><div class="stat"><strong>${I.length}</strong><span class="mut">Invoices</span></div><div class="stat"><strong>${db.customers.length}</strong><span class="mut">Customers</span></div><div class="stat"><strong>${money(sum(Q))}</strong><span class="mut">Quotation value</span></div><div class="stat"><strong>${money(sum(A))}</strong><span class="mut">Invoice value</span></div><div class="stat"><strong style="color:#b91c1c">${money(pend)}</strong><span class="mut">Pending payments${od?' · '+od+' overdue':''}</span></div></div></div>
<div class="card"><h3>Quick actions</h3><div class="actions" style="margin:0"><button class="btn" onclick="go('editor','quotation')">＋ Quotation</button><button class="btn dark" onclick="go('editor','invoice')">＋ Invoice</button><button class="btn secondary" onclick="go('custForm')">＋ Customer</button><button class="btn secondary" onclick="go('matForm')">＋ Material</button></div></div>
${(()=>{let f=fin();return`<div class="card" onclick="go('billing')" style="cursor:pointer"><div class="tl"><h3>Billing summary</h3><span class="mut">Open ›</span></div><div class="g2"><div class="stat" style="background:#d1fae5"><strong>${money(f.bal)}</strong><span class="mut">Available balance</span></div><div class="stat" style="background:#fee2e2"><strong>${money(f.out)}</strong><span class="mut">Net shop debit</span></div></div></div>`})()}<div class="card"><h3>Recent documents</h3>${rec.map(docRow).join('')||'<div class="empty">No documents yet. Create your first quotation.</div>'}</div>
<div class="card"><h3>Recent activity</h3>${lgs.map(l=>`<div class="tot"><span>${esc(l.n)} · ${esc(l.t)}</span><span class="mut">${l.at.slice(0,10)}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`}
function list(t){let f=F[t]=F[t]||{q:'',s:''};$('v').innerHTML=`<div class="tl"><h2>${t==='invoice'?'Invoices':'Quotations'}</h2><button class="btn" onclick="go('editor','${t}')">＋ New</button></div><div class="row" style="margin-bottom:6px"><input placeholder="Search number or customer" value="${esc(f.q)}" oninput="F['${t}'].q=this.value;lb('${t}')"><select onchange="F['${t}'].s=this.value;lb('${t}')"><option value="">All status</option>${(t==='invoice'?ST_I:ST_Q).map(s=>`<option ${f.s===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="lb"></div>`;lb(t)}
function lb(t){let f=F[t],q=f.q.toLowerCase(),a=db.docs.filter(d=>d.type===t&&(!f.s||eff(d)===f.s)&&(!q||(d.number+' '+d.customerName).toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.number.localeCompare(a.number));$('lb').innerHTML=a.length?a.map(docRow).join(''):'<div class="empty">No documents found.</div>'}
function quotation(){list('quotation')}function invoice(){list('invoice')}
function more(){$('v').innerHTML=`<h2>More</h2>${[['catalogue','▦','Catalogue','Materials, categories, default rates'],['reports','▥','Reports','Monthly sales, customers, GST, export'],['settings','⚙','Settings','Business, GST, bank, numbering, backup']].map(x=>`<div class="item" onclick="go('${x[0]}')"><strong>${x[1]} ${x[2]}</strong><div class="meta">${x[3]}</div></div>`).join('')}<div class="item" onclick="lockNow()"><strong>🔒 Lock app</strong><div class="meta">Password will be asked next time you open the app</div></div>`}
/* ---------- Editor ---------- */
function editor(a){let d=db.docs.find(x=>x.id===a),t=d?d.type:a,s=db.settings,inv=t==='invoice';
if(d&&d.status==='Cancelled')return toast('Cancelled documents cannot be edited');
let x=d||{number:nextNo(t,today()),date:today(),rate:s.gstRate??18,taxType:s.taxType||'IGST',unit:s.unit||'sq.ft',terms:s.terms||'',extra:0,lines:[{}],hsn:s.hsn||'',reverse:'No'};
$('v').innerHTML=`<div class="tl"><h2>${d?'Edit':'New'} ${t}</h2><button class="btn secondary small" onclick="${d?`go('show','${d.id}')`:`go('${t}')`}">← Back</button></div>
<div class="card"><input type="hidden" id="dId" value="${d?d.id:''}"><input type="hidden" id="dT" value="${t}">
<div class="row"><div><label>Number</label><input id="dNo" value="${esc(x.number)}"></div><div><label>Date</label><input id="dDate" type="date" value="${esc(x.date)}" onchange="if(!$('dId').value)$('dNo').value=nextNo('${t}',this.value)"></div></div>
<div class="row"><div><label>${inv?'Due date':'Valid until'}</label><input id="dDue" type="date" value="${esc(inv?x.due:x.validUntil)}"></div><div><label>Project / reference</label><input id="dProject" value="${esc(x.project)}"></div></div>
<label>Customer *</label><select id="dC" onchange="pickC()"><option value="">Select customer</option>${db.customers.map(c=>`<option value="${c.id}" ${x.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
<label>Customer address</label><textarea id="dAddr">${esc(x.customerAddress)}</textarea>
${inv?`<div class="row"><div><label>Customer GSTIN</label><input id="dGstin" value="${esc(x.recipientGstin)}"></div><div><label>PAN</label><input id="dPan" value="${esc(x.recipientPan)}"></div></div><div class="row"><div><label>Place of supply</label><input id="dPos" value="${esc(x.placeSupply)}"></div><div><label>State code</label><input id="dPosC" value="${esc(x.placeCode)}"></div></div><div class="row"><div><label>Reverse charge</label><select id="dRev"><option>No</option><option ${x.reverse==='Yes'?'selected':''}>Yes</option></select></div><div><label>Work order ref</label><input id="dWo" value="${esc(x.workRef)}"></div></div>`:''}</div>
<div class="card"><div class="tl"><h3>Items & measurements</h3><button class="btn secondary small" onclick="addLine()">＋ Add Another Item</button></div><div id="lines"></div>
<div class="row"><div><label>Price basis</label><select id="dUnit">${['sq.ft','sq.m','unit','running ft','kg'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>HSN / SAC</label><input id="dHsn" value="${esc(x.hsn)}"></div></div>
<div class="row"><div><label>Tax type</label><select id="dTax"><option value="IGST" ${x.taxType==='IGST'?'selected':''}>IGST</option><option value="CGST_SGST" ${x.taxType==='CGST_SGST'?'selected':''}>CGST + SGST</option><option value="NONE" ${x.taxType==='NONE'?'selected':''}>No GST</option></select></div><div><label>GST rate %</label><input id="dRate" type="number" min="0" step="any" value="${x.rate}"></div></div>
<div class="row"><div><label>Additional charges ₹</label><input id="dExtra" type="number" min="0" step="any" value="${x.extra}"></div><div><label>Charge description</label><input id="dExtraD" value="${esc(x.extraDesc)}"></div></div><div id="totals"></div></div>
<div class="card"><h3>Terms & notes</h3><textarea id="dTerms" style="min-height:110px">${esc(x.terms)}</textarea><label>Note (optional)</label><textarea id="dNote">${esc(x.note)}</textarea></div>
<div class="actions"><button class="btn" onclick="saveDoc()">Save</button><button class="btn secondary" onclick="go('${t}')">Cancel</button></div>`;
(x.lines.length?x.lines:[{}]).forEach(addLine);['dTax','dRate','dExtra'].forEach(i=>$(i).oninput=calc);$('lines').oninput=calc;calc()}
function addLine(x={}){let e=document.createElement('div');e.className='ms';const v=k=>x[k]??'';
e.innerHTML=`<div class="mh"><b>Item</b><button class="btn danger small" onclick="this.closest('.ms').remove();calc()">✕</button></div><label>Catalogue material</label><select class="lm" onchange="pick(this)"><option value="">Select (optional)</option>${db.materials.map(m=>`<option value="${m.id}" ${x.materialId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
<label>Description *</label><textarea class="ld" style="min-height:52px">${esc(x.description)}</textarea>
<div class="row"><div><label>Width</label><input class="lw" type="number" min="0" step="any" value="${v('width')}"></div><div><label>Length</label><input class="ll" type="number" min="0" step="any" value="${v('length')}"></div><div><label>Nos</label><input class="ln" type="number" min="0" step="any" value="${x.nos??1}"></div></div>
<div class="row"><div><label>Area / Qty (auto, editable)</label><input class="lq" type="number" min="0" step="any" value="${x.qtyManual?x.qty:''}" placeholder="auto"></div><div><label>Rate ₹</label><input class="lr" type="number" min="0" step="any" value="${v('rate')}"></div></div><div class="mut ls"></div>`;$('lines').appendChild(e)}
function pick(sel){let m=db.materials.find(x=>x.id===sel.value),b=sel.closest('.ms');if(!m)return;b.querySelector('.ld').value=[m.name,m.thickness,m.colour,m.description].filter(Boolean).join(' · ');if(m.rate)b.querySelector('.lr').value=m.rate;if(m.unit&&![...$('lines').children].some(e=>e!==b&&e.querySelector('.ld').value))$('dUnit').value=m.unit;calc()}
function pickC(){let c=db.customers.find(x=>x.id===$('dC').value);if(!c)return;$('dAddr').value=c.address||'';let sc=(c.gstin||'').slice(0,2);if($('dGstin')){$('dGstin').value=c.gstin||'';if(sc)$('dPosC').value=sc}if(sc&&db.settings.stateCode)$('dTax').value=sc===db.settings.stateCode?'CGST_SGST':'IGST';calc()}
function lines(){return[...document.querySelectorAll('.ms')].map(e=>{let g=c=>e.querySelector(c),w=+g('.lw').value||0,l=+g('.ll').value||0,n=g('.ln').value===''?1:+g('.ln').value,man=g('.lq').value!=='',q=man?+g('.lq').value:Math.round(w*l*n*1000)/1000,rt=+g('.lr').value||0,a=r2(q*rt);g('.ls').textContent=q?`Area: ${q} ${$('dUnit').value} → ${money(a)}`:'';return{materialId:g('.lm').value,description:g('.ld').value,width:w||'',length:l||'',nos:n,qty:q,qtyManual:man,rate:rt,amount:a}})}
function calc(){let L=lines(),sub=r2(L.reduce((a,x)=>a+x.amount,0)),ex=r2($('dExtra').value),tx=r2(sub+ex),rt=+$('dRate').value||0,t=$('dTax').value,tax=t==='NONE'?0:r2(tx*rt/100),cg=t==='CGST_SGST'?r2(tax/2):0,sg=t==='CGST_SGST'?r2(tax-cg):0,gr=r2(tx+tax);
let ta=Math.round(L.reduce((a,x)=>a+x.qty,0)*1000)/1000;$('totals').innerHTML=`<div class="tot" style="font-weight:700"><span>Total area (${L.length} item${L.length==1?'':'s'})</span><span>${ta} ${$('dUnit').value}</span></div><div class="tot"><span>Subtotal</span><span>${money(sub)}</span></div>${ex?`<div class="tot"><span>Additional</span><span>${money(ex)}</span></div>`:''}<div class="tot"><span>Taxable value</span><span>${money(tx)}</span></div>${t==='IGST'?`<div class="tot"><span>IGST ${rt}%</span><span>${money(tax)}</span></div>`:t==='CGST_SGST'?`<div class="tot"><span>CGST ${rt/2}%</span><span>${money(cg)}</span></div><div class="tot"><span>SGST ${rt/2}%</span><span>${money(sg)}</span></div>`:''}<div class="tot gr"><span>Grand total</span><span>${money(gr)}</span></div>`;
return{lines:L,subtotal:sub,extra:ex,taxable:tx,rate:rt,taxType:t,tax,cgst:cg,sgst:sg,grand:gr}}
function saveDoc(){let t=$('dT').value,inv=t==='invoice',c=db.customers.find(x=>x.id===$('dC').value),k=calc(),id=$('dId').value,no=$('dNo').value.trim(),old=db.docs.find(x=>x.id===id);
if(!c)return toast('Select a customer');if(!$('dDate').value)return toast('Enter the date');if(!no)return toast('Enter a document number');

function saveE(){let id=$('eId').value,c=$('eC').value==='__new'?$('eCN').value.trim():$('eC').value,a=r2($('eA').value);if(!$('eD').value)return toast('Enter the date');if(!c)return toast('Enter a category name');if(c.toLowerCase()===NS.toLowerCase())return toast('Record net shop payments in Net Debit');if(!(a>0))return toast('Amount must be greater than zero');if(!$('eP').value.trim())return toast('Enter who paid');

<label>Filter history by shop</label><select onchange="BS.nf=this.value;bNet()"><option value="">All shops</option>${S.map(s=>`<option value="${esc(s.n.toLowerCase())}" ${BS.nf===s.n.toLowerCase()?'selected':''}>${esc(s.n)}</option>`).join('')}</select>

<h3 style="margin-top:14px">Payment history</h3>${P.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="item" onclick="go('npForm','${p.id}')"><div class="tl"><strong>${esc(p.shop)}</strong><b>${money(p.amount)}</b></div><div class="meta">${esc(p.date)} · ${esc(p.paidBy)} · ${esc(p.method)}${p.notes?' · '+esc(p.notes):''}</div></div>`).join('')||'<div class="empty">No payments yet.</div>'}`}
const shopDL=()=>`<datalist id="sn">${shops().map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist>`;
function nmForm(id){let m=db.netMaterials.find(x=>x.id===id)||{date:today(),unit:'Feet',qty:1};$('v').innerHTML=`<div class="tl"><h2>${id?'Edit':'Add'} material / debit</h2><button class="btn secondary small" onclick="BS.t='net';go('billing')">← Back</button></div>${shopDL()}<div class="card"><input type="hidden" id="nId" value="${id||uid()}"><div class="row"><div><label>Date *</label><input id="nD" type="date" value="${m.date}"></div><div><label>Net shop *</label><input id="nS" list="sn" value="${esc(m.shop)}"></div></div><label>Material type *</label><input id="nM" value="${esc(m.material)}" placeholder="Balcony Net"><div class="row"><div><label>Length *</label><input id="nL" type="number" min="0" step="any" value="${m.length??''}" oninput="nT()"></div><div><label>Unit</label><select id="nU">${['Feet','Meter','Other'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><div class="row"><div><label>Quantity (default 1)</label><input id="nQ" type="number" min="0" step="any" value="${m.qty}" oninput="nT()"></div><div><label>Rate per unit ₹ *</label><input id="nR" type="number" min="0" step="any" value="${m.rate??''}" oninput="nT()"></div></div><div class="tot gr"><span>Total material amount</span><span id="nTot">₹0.00</span></div><label>Notes</label><textarea id="nN">${esc(m.notes)}</textarea><div class="actions"><button class="btn" onclick="saveNM()">Save</button>${id?`<button class="btn danger" onclick="delRec('netMaterials','${id}',()=>{BS.t='net';go('billing')})">Delete</button>`:''}</div></div>`;nT()}
const nAmt=()=>Math.round((+$('nL').value||0)*($('nQ').value===''?1:+$('nQ').value)*(+$('nR').value||0)*100)/100;function nT(){$('nTot').textContent=money(nAmt())}
function saveNM(){let id=$('nId').value,sh=$('nS').value.trim(),mt=$('nM').value.trim(),L=+$('nL').value,q=$('nQ').value===''?1:+$('nQ').value,R=+$('nR').value;if(!$('nD').value)return toast('Enter the date');if(!sh)return toast('Enter net shop name');if(!mt)return toast('Enter material type');if(!(L>0))return toast('Length must be greater than zero');if(!(q>0))return toast('Quantity must be greater than zero');if(!(R>=0)||$('nR').value==='')return toast('Enter a valid rate');
let old=db.netMaterials.find(x=>x.id===id),m=Object.assign(old||{id,created:new Date().toISOString()},{date:$('nD').value,shop:sh,material:mt,length:L,unit:$('nU').value,qty:q,rate:R,amount:nAmt(),notes:$('nN').value});if(!old)db.netMaterials.push(m);persist();toast('Material saved');BS.t='net';go('billing')}
function npForm(id){let p=db.netPayments.find(x=>x.id===id)||{date:today()};$('v').innerHTML=`<div class="tl"><h2>${id?'Edit':'Pay'} net shop</h2><button class="btn secondary small" onclick="BS.t='net';go('billing')">← Back</button></div>${shopDL()}${pdl()}<div class="card"><input type="hidden" id="pId" value="${id||uid()}"><div class="row"><div><label>Payment date *</label><input id="pD" type="date" value="${p.date}"></div><div><label>Amount paid ₹ *</label><input id="pA" type="number" min="0" step="any" value="${p.amount??''}"></div></div><label>Net shop *</label><input id="pS" list="sn" value="${esc(p.shop)}"><div class="row"><div><label>Paid by *</label><input id="pB" list="pn" value="${esc(p.paidBy)}"></div><div><label>Method</label><select id="pM">${mOpts(p.method||'Cash')}</select></div></div><label>Notes</label><textarea id="pN">${esc(p.notes)}</textarea><p class="mut">This payment is deducted from the available balance once.</p><div class="actions"><button class="btn" onclick="saveNP()">Save payment</button>${id?`<button class="btn danger" onclick="delRec('netPayments','${id}',()=>{BS.t='net';go('billing')})">Delete</button>`:''}</div></div>`}
function saveNP(){let id=$('pId').value,sh=$('pS').value.trim(),a=r2($('pA').value);if(!$('pD').value)return toast('Enter the date');if(!sh)return toast('Enter net shop name');if(!(a>0))return toast('Amount must be greater than zero');if(!$('pB').value.trim())return toast('Enter who paid');
let old=db.netPayments.find(x=>x.id===id),S=shops().find(s=>s.n.toLowerCase()===sh.toLowerCase()),o=S?r2(S.o+(old&&old.shop.toLowerCase()===sh.toLowerCase()?old.amount:0)):0;if(a>o+0.001&&!confirm('Payment is more than the outstanding debit ('+money(Math.max(0,o))+'). Save anyway?'))return;
let p=Object.assign(old||{id,created:new Date().toISOString()},{date:$('pD').value,shop:sh,amount:a,method:$('pM').value,paidBy:$('pB').value.trim(),notes:$('pN').value});if(!old)db.netPayments.push(p);persist();toast('Payment saved');BS.t='net';go('billing')}
/* ---------- Settings & backup ---------- */
const S_=(k,l,x='',ta)=>`<label>${l}</label>${ta?`<textarea data-k="${k}" ${ta>1?'style="min-height:120px"':''}>${esc(db.settings[k])}</textarea>`:`<input data-k="${k}" value="${esc(db.settings[k])}" ${x}>`}`;
function collect(){document.querySelectorAll('[data-k]').forEach(e=>db.settings[e.dataset.k]=e.value)}
function settings(){let s=db.settings;$('v').innerHTML=`<div class="tl"><h2>Settings</h2><button class="btn secondary small" onclick="go('more')">← Back</button></div>
<div class="card"><h3>A. Business details</h3>${S_('business','Business name *')}${S_('owner','Proprietor / contact')}${S_('address','Address','',1)}<div class="row"><div>${S_('phone','Phone','type=tel')}</div><div>${S_('email','Email','type=email')}</div></div></div>
<div class="card"><h3>B. Logo & signature</h3><label>Logo</label><input type="file" accept="image/*" onchange="img(this,'logo')">${s.logo?`<img src="${s.logo}" style="max-height:60px;margin-top:8px"> <button class="btn danger small" onclick="collect();db.settings.logo='';persist();settings()">Remove</button>`:''}${S_('signature','Authorised signatory name')}<label>Signature image</label><input type="file" accept="image/*" onchange="img(this,'signImage')">${s.signImage?`<img src="${s.signImage}" style="max-height:50px;margin-top:8px"> <button class="btn danger small" onclick="collect();db.settings.signImage='';persist();settings()">Remove</button>`:''}</div>
<div class="card"><h3>C. Terms & conditions</h3>${S_('terms','Default terms (one per line)','',2)}</div>
<div class="card"><h3>D. GST details</h3>${S_('gstin','Business GSTIN')}<div class="row"><div>${S_('state','State')}</div><div>${S_('stateCode','State code')}</div></div>${S_('pan','PAN')}${S_('hsn','Default HSN / SAC')}<div class="row"><div>${S_('gstRate','Default GST %','type=number step=any')}</div><div><label>Default tax type</label><select data-k="taxType"><option value="IGST" ${s.taxType==='IGST'?'selected':''}>IGST</option><option value="CGST_SGST" ${s.taxType==='CGST_SGST'?'selected':''}>CGST + SGST</option></select></div></div></div>
<div class="card"><h3>E. Bank details</h3>${S_('bank','Bank details','',1)}${S_('payTerms','Payment terms')}</div>
<div class="card"><h3>F. Document numbering</h3><div class="row"><div>${S_('qPre','Quotation prefix','placeholder=QT')}</div><div>${S_('iPre','Invoice prefix','placeholder=INV')}</div></div><p class="mut">Format: PREFIX/${fy(today())}/001 – restarts each financial year (April–March). Next: <b>${esc(nextNo('quotation',today()))}</b> · <b>${esc(nextNo('invoice',today()))}</b></p></div>
<div class="card"><h3>G. Export preferences</h3><label>Show logo on documents</label><select data-k="xLogo"><option>Yes</option><option ${s.xLogo==='No'?'selected':''}>No</option></select>${S_('footer','Footer text')}<label>Default price basis</label><select data-k="unit">${['sq.ft','sq.m','unit','running ft','kg'].map(u=>`<option ${(s.unit||'sq.ft')===u?'selected':''}>${u}</option>`).join('')}</select></div>
<div class="actions" style="margin:0 0 12px"><button class="btn" onclick="saveS()">Save settings</button></div>
<div class="card"><h3>Backup & restore</h3><p class="mut">Data lives in this browser. Download a backup regularly. Restoring replaces current data (a safety copy is kept).</p><div class="actions"><button class="btn secondary" onclick="backup()">Download backup</button><label class="btn secondary" style="margin:0">Restore backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div></div>`}
function saveS(){collect();let g=(db.settings.gstin||'').trim().toUpperCase();if(g&&!GST.test(g))return toast('Business GSTIN format is invalid');db.settings.gstin=g;if(!db.settings.business?.trim())return toast('Business name is required');['gstRate'].forEach(k=>{if(db.settings[k]!==''&&+db.settings[k]<0)db.settings[k]=18});persist();toast('Settings saved');settings()}
function img(inp,k){let f=inp.files[0];if(!f)return;collect();let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let z=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*z;c.height=i.height*z;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.settings[k]=c.toDataURL('image/png');persist();settings()};i.onerror=()=>toast('Image could not be read');i.src=r.result};r.readAsDataURL(f)}
function backup(){save(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'quote-invoice-backup-'+today()+'.json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result);if(!Array.isArray(p.customers)||!Array.isArray(p.materials)||!Array.isArray(p.docs))throw 0;if(!confirm('Replace current data with this backup?'))return;localStorage.setItem(KEY+'_before_restore',JSON.stringify(db));db={customers:[],materials:[],docs:[],settings:{},...p};migrate();persist();toast('Backup restored');go('home')}catch(x){toast('Invalid backup file')}};r.readAsText(f)}
const PH=['cdbb8163cbe7c73bac2ee3b78dfd42f7cbf1a06cf6295a8b46451c04a7437796','c181ttz0ekk2'];let ready=0,fails=0,hidAt=0;
function cy(s,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
async function okPw(s){try{let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qim|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===PH[0]}catch(e){return'c'+cy(s)===PH[1]}}
async function unlock(){let v=$('lp').value;if(await okPw(v)){$('lock').style.display='none';$('lp').value='';$('le').textContent='';fails=0;try{localStorage.setItem(KEY+'_unlocked','1')}catch(e){}if(!ready){ready=1;load()}else go(tab)}else{fails++;$('lp').value='';$('le').textContent='Wrong password'+(fails>2?' – wait 5 seconds':'');if(fails>2){$('lp').disabled=true;setTimeout(()=>{$('lp').disabled=false;$('lp').focus()},5000)}}}
function lockNow(){try{localStorage.removeItem(KEY+'_unlocked')}catch(e){}$('v').innerHTML='';$('lock').style.display='flex';$('lp').focus()}
let UL=0;try{UL=localStorage.getItem(KEY+'_unlocked')==='1'}catch(e){}
if(UL){$('lock').style.display='none';ready=1;load()}else $('lp').focus();
</script></body></html>
